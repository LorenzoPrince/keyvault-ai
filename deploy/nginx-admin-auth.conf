# KeyVault AI · Protección de /admin y /api/admin con autenticación básica HTTP.
#
# Pegar estos bloques DENTRO del bloque `server { ... }` de HTTPS del sitio
# (por ejemplo /etc/nginx/sites-available/keyvault), antes de `location /` y de `location /api/`.
# `^~` hace que estas rutas ganen sobre las ubicaciones genéricas.
#
# El archivo de credenciales se genera con deploy/setup-admin-auth.sh (nunca se versiona).

location ^~ /api/admin {
    auth_basic "Acceso Restringido - Administracion";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /admin {
    auth_basic "Acceso Restringido - Administracion";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Si el usuario cancela el login, se sirve la SPA con estado 401 y React muestra
    # la pantalla "Acceso restringido" en lugar de la página de error de Nginx.
    error_page 401 /index.html;
    try_files $uri /index.html;
}
